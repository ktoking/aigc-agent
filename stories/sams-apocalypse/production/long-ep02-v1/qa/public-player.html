<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山姆避难记·第二集：门外的人</title>
<style>body{margin:0;background:#14181b;color:#e9e4da;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:26px;margin:0 0 6px}p{color:#b7b7ae}video{width:100%;display:block;background:#000;border-radius:10px}button,a{color:inherit}button{background:#263034;border:1px solid #465255;border-radius:6px;padding:9px 13px;cursor:pointer;margin:5px 6px 5px 0}a{display:inline-block;margin:5px 14px 5px 0;color:#e3bb75}#status{font-size:14px;color:#a9b6b7;font-variant-numeric:tabular-nums}#chapters{margin-top:14px}#cue{min-height:30px;font-size:18px;color:#f2d2a0}.note{font-size:13px}pre{font-size:12px;white-space:pre-wrap;color:#8e9b9d}</style>
<main><h1>山姆避难记·第二集：门外的人</h1><p>十分钟 · 生存 / 囤货 / 建设 · 真人电影静帧</p>
<video id="film" controls playsinline preload="metadata"><source src="video.mp4" type="video/mp4"><track id="subtitles" src="captions.vtt" kind="subtitles" srclang="zh-CN" label="中文独立字幕"></video>
<div><button id="play">正常速度播放</button><button id="pause">暂停</button><button id="toggle">字幕校对：关</button></div><div id="status">读取视频中</div><div id="cue"></div><div id="chapters"></div>
<p class="note">MP4无声音、无烧录或内嵌字幕。字幕校对仅在播放器显示外挂字幕。新台词按参考语速估时，后期配音删改或加速后需同步对齐。</p>

<details><summary>参考分析与制作检查</summary><a href="reference-findings.md">字幕差异分析</a><a href="plot-research.md">题材检索记录</a><a href="qa.json">文件检查</a><pre id="metrics"></pre></details></main>
<script>
const film=document.querySelector('#film'),status=document.querySelector('#status'),cue=document.querySelector('#cue');
const report={normalRate:true,playEvents:[],seeks:[],errors:[]};let showing=false;
const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`:'--:--';
document.querySelector('#play').onclick=()=>{film.playbackRate=1;film.play();};document.querySelector('#pause').onclick=()=>film.pause();
document.querySelector('#toggle').onclick=()=>{showing=!showing;film.textTracks[0].mode=showing?'showing':'hidden';document.querySelector('#toggle').textContent=`字幕校对：${showing?'开':'关'}`;};
function update(){const q=film.getVideoPlaybackQuality?.();status.textContent=`${fmt(film.currentTime)} / ${fmt(film.duration)} · ${film.playbackRate}倍速 · ${film.paused?'已暂停':'播放中'}`;cue.textContent=showing?Array.from(film.textTracks[0]?.activeCues||[]).map(c=>c.text).join(' '):'';document.querySelector('#metrics').textContent=JSON.stringify({...report,time:film.currentTime,duration:film.duration,rate:film.playbackRate,width:film.videoWidth,height:film.videoHeight,ready:film.readyState,decoded:q?.totalVideoFrames,dropped:q?.droppedVideoFrames},null,2);}
film.addEventListener('timeupdate',update);film.addEventListener('loadedmetadata',()=>{film.textTracks[0].mode='hidden';update();});film.addEventListener('play',()=>{report.playEvents.push({time:film.currentTime,rate:film.playbackRate});update();});film.addEventListener('pause',update);film.addEventListener('seeked',()=>{report.seeks.push(film.currentTime);update();});film.addEventListener('error',()=>{report.errors.push(film.error?.message);update();});
fetch('chapters.json').then(r=>r.json()).then(chs=>chs.forEach(ch=>{const b=document.createElement('button');b.textContent=`${fmt(ch.start_seconds)} ${ch.title}`;b.onclick=()=>{film.currentTime=ch.start_seconds;film.playbackRate=1;film.play();};document.querySelector('#chapters').append(b);}));
</script></html>
