<text x="42" y="1690" font-size="22" fill="#1d292c" font-weight="400" font-family="PingFang SC, Heiti SC, Arial Unicode MS, sans-serif"><tspan x="42" dy="0">镜头1（0–4s）：夜晚废弃街道，高空俯拍缓慢下降，大雾、废车、燃烧高楼和红色警报灯建立绝</tspan><tspan x="42" dy="34">境。镜头2（4–8s）：林晚靠在侧翻警车旁喘息，沈清雪站在身侧，两人保持同一套3D非真人角</tspan><tspan x="42" dy="34">色脸。镜头3（8–11s）：林晚后背抓伤特写，痛感克制，不过度血腥。镜头4（11–15s）</tspan><tspan x="42" dy="34">：尸潮从浓雾中围拢，双女主背靠背进入战斗姿态，林晚指尖出现蓝色空间能量。角色锁定：林晚黑色</tspan><tspan x="42" dy="34">超长直发、左眼下小痣、黑色破损战术夹克；沈清雪齐肩短发空气刘海、白色战术服。制作要求：3D</tspan><tspan x="42" dy="34">动画电影风，明显非真人，冷灰蓝末日氛围，9:16竖屏，15秒，首尾帧连续。</tspan></text>
