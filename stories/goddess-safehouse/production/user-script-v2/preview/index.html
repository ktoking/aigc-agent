<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全屋 · 前10集</title><style>body{background:#101417;color:#eee;font:16px system-ui;margin:0;padding:28px;max-width:1100px;margin:auto}h1{font-size:26px}video{width:100%;max-height:70vh;background:#000;border-radius:10px}button{border:0;border-radius:8px;background:#264450;color:#fff;padding:12px 18px;cursor:pointer}#episodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}.card{background:#1b2328;border-radius:10px;padding:16px}.card p{color:#b5c1c5}audio{width:100%}#status{color:#a8c4b3;margin:12px 0}h2{font-size:17px}a{color:#a9d0df}</style><h1>末世囤货：我的安全屋住满了女神</h1><p>前10集 · 确认稿 · Chinese_worker_male · 保音调加速1.3倍 · 中文字幕无标点</p><video id="video" controls preload="metadata" playsinline></video><div id="status">选择一集播放</div><div id="episodes"></div><script>window.playLog=[];let data=[],current=null;const v=document.querySelector('video');v.playbackRate=1;v.addEventListener('playing',()=>{window.playLog.push({event:'playing',episode:current,time:v.currentTime,rate:v.playbackRate,muted:v.muted});document.querySelector('#status').textContent=current+' 正在播放'});v.addEventListener('ended',()=>{window.playLog.push({event:'ended',episode:current,time:v.currentTime,duration:v.duration,rate:v.playbackRate});document.querySelector('#status').textContent=current+' 播放完成'});v.addEventListener('error',()=>window.playLog.push({event:'error',episode:current,code:v.error?.code}));async function play(e){current=e.episode;v.src=e.video;v.playbackRate=1;await v.play()}async function refresh(){data=await(await fetch('/production/user-script-v2/preview-manifest.json?t='+Date.now())).json();const box=document.querySelector('#episodes');box.innerHTML='';for(const e of data){const d=document.createElement('div');d.className='card';const h=document.createElement('h2');h.textContent=e.episode+'《'+e.title+'》';d.appendChild(h);if(e.video){const b=document.createElement('button');b.textContent='播放'+e.episode;b.onclick=()=>play(e);d.appendChild(b)}else{const p=document.createElement('p');p.textContent='图片制作中';d.appendChild(p)}if(e.audio){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=e.audio;d.appendChild(a)}box.appendChild(d)}}refresh();</script></html>
