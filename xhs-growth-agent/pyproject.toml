[project]
name = "xhs-growth-agent"
version = "0.1.0"
description = "本地可审核的小红书内容运营系统"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic>=2.9", "httpx>=0.27", "python-dotenv>=1.0", "apscheduler>=3.10,<4", "pillow>=11", "feedparser>=6.0", "playwright>=1.49"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
